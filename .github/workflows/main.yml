name: Roll up effort to parent issues

on:
  schedule:
    - cron: "*/1 * * * *"   # field edits don't trigger workflows, so poll
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, deleted, transferred]

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          OWNER: rijimol
          OWNER_TYPE: user     # or: user
          PROJECT_NUMBER: "4"
          FIELD_NAME: Effort
        with:
          github-token: $valcare
          script: |
            const { OWNER, OWNER_TYPE, PROJECT_NUMBER, FIELD_NAME } = process.env;

            const query = `
              query($login:String!, $number:Int!, $cursor:String, $field:String!) {
                owner: ${OWNER_TYPE}(login:$login) {
                  projectV2(number:$number) {
                    id
                    field(name:$field) { ... on ProjectV2Field { id } }
                    items(first:100, after:$cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        content { ... on Issue { id parent { id } } }
                        effort: fieldValueByName(name:$field) {
                          ... on ProjectV2ItemFieldNumberValue { number }
                        }
                      }
                    }
                  }
                }
              }`;

            let items = [], cursor = null, projectId, fieldId;
            do {
              const r = await github.graphql(query, {
                login: OWNER, number: Number(PROJECT_NUMBER),
                cursor, field: FIELD_NAME,
              });
              const p = r.owner.projectV2;
              projectId = p.id;
              fieldId = p.field.id;
              items.push(...p.items.nodes);
              cursor = p.items.pageInfo.hasNextPage ? p.items.pageInfo.endCursor : null;
            } while (cursor);

            const issues = items.filter(i => i.content?.id);
            const itemByIssue = new Map(issues.map(i => [i.content.id, i]));

            // sum child efforts per parent issue
            const sums = new Map();
            for (const i of issues) {
              const parent = i.content.parent?.id;
              if (!parent) continue;
              sums.set(parent, (sums.get(parent) || 0) + (i.effort?.number || 0));
            }

            for (const [parentId, total] of sums) {
              const parentItem = itemByIssue.get(parentId);
              if (!parentItem) continue;                        // parent not in project
              if ((parentItem.effort?.number ?? null) === total) continue;
              await github.graphql(`
                mutation($p:ID!, $i:ID!, $f:ID!, $v:Float!) {
                  updateProjectV2ItemFieldValue(input:{
                    projectId:$p, itemId:$i, fieldId:$f, value:{ number:$v }
                  }) { projectV2Item { id } }
                }`, { p: projectId, i: parentItem.id, f: fieldId, v: total });
              core.info(`Set parent ${parentId} effort to ${total}`);
            }
